name: CEN CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov psycopg2-binary
      - name: Linting with Flake8
        run: flake8 server/src/ --max-line-length=100
      - name: Pytest and Coverage Gate
        run: python -m pytest server/tests/ --cov=server/src/ --cov-fail-under=80

  security-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r server/src/ -ll