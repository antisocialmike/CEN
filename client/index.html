<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nómina que cuadra | CEN Payroll</title>
    <meta
      name="description"
      content="Calculas el bruto, CEN devuelve el ISR, el IMSS y el neto. Cada recibo queda guardado y visible para tu equipo."
    />
    <!-- Aqui habia dos <link rel="stylesheet"> bloqueantes, uno a
         fonts.googleapis.com y otro a api.fontshare.com, con sus cuatro
         preconnect. Las tres familias se sirven ahora desde este mismo origen y
         se declaran en theme.css, asi que no queda nada que pedir fuera: ni
         DNS, ni TLS, ni el viaje a por el CSS antes de pedir la fuente. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />

    <!-- Hasta ahora no habia ningun icono declarado: el navegador pedia
         /favicon.ico, recibia un 404 y pintaba el generico.

         El SVG es un corte propio del monograma para tamanos chicos, no el
         mismo dibujo de LogoMark. A 16 px el de la aplicacion deja 60 de 256
         pixeles en un gris que no es ni el jade ni el blanco, porque sus huecos
         miden 1.45 y 1.50 px. El corte del favicon usa una rejilla de 16, asi
         que a 16 px cada unidad vale un pixel exacto y no queda ninguno sucio.

         El PNG va detras para los navegadores que no leen SVG, y de paso sirve
         de icono al guardar en la pantalla de inicio. 192 = 16 x 12: escala
         entera, mismos bordes limpios. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icono-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icono-192.png" />

    <!-- El enlace se comparte por WhatsApp, que es el canal real de una PyME
         mexicana, y sin esto llega desnudo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="CEN Payroll" />
    <meta property="og:title" content="Nómina que cuadra" />
    <meta
      property="og:description"
      content="Calculas el bruto, CEN devuelve el ISR, el IMSS y el neto. Cada recibo queda guardado y visible para tu equipo."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <script>
      (function () {
        var raiz = document.documentElement;

        try {
          var t = localStorage.getItem("cen_theme");
          if (t === "light" || t === "dark") raiz.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
