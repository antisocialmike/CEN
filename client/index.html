<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nómina que cuadra | CEN Payroll</title>
    <meta
      name="description"
      content="Calculas el bruto, CEN devuelve el ISR, el IMSS y el neto. Cada recibo queda guardado y visible para tu equipo."
    />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0B0F" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cen_theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
